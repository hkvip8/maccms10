<header class="site-header">
  <div class="container">
    <a class="logo" href="{$maccms.path}">
      <img src="{:mac_url_img($maccms.site_logo)}" alt="{$maccms.site_name}">
      <span>{$maccms.site_name}</span>
    </a>
    <button class="mobile-toggle" type="button" data-nav-toggle>菜单</button>
    <nav class="site-nav" data-nav>
      <a href="{$maccms.path}">首页</a>
      {maccms:type num="8" order="asc" by="sort" mid="1"}
      <a href="{:mac_url_type($vo)}">{$vo.type_name}</a>
      {/maccms:type}
    </nav>
    <div class="nav-actions">
      <form class="search-form" action="{:mac_url('vod/search')}" method="get">
        <input type="text" name="wd" value="{$param.wd}" placeholder="搜索影片" autocomplete="off">
        <button type="submit">搜索</button>
      </form>
    </div>
  </div>
</header>
